name: fetch-brand-image

on:
  push:
    branches:
      - arena/087d5004-zybble
    paths:
      - .github/workflows/fetch-brand-image.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/087d5004-zybble
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download uploaded brand image
        run: |
          set -euo pipefail
          mkdir -p tmp
          download() {
            local url="$1"
            curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
              -A "Mozilla/5.0 (compatible; ZybbleBrandFetch/1.0)" \
              -o tmp/Open-Book-Icon-on-Purple.png \
              "$url"
          }
          download "https://i.postimg.cc/1XnzDrWQ/Open-Book-Icon-on-Purple.png" \
            || download "https://i.postimg.cc/byL2c6ks/Open-Book-Icon-on-Purple.png?dl=1"
          file tmp/Open-Book-Icon-on-Purple.png
          # Reject HTML error pages.
          if file tmp/Open-Book-Icon-on-Purple.png | grep -Eqi 'HTML|ASCII|text'; then
            echo "Downloaded file is not an image" >&2
            head -c 400 tmp/Open-Book-Icon-on-Purple.png >&2 || true
            exit 1
          fi
          wc -c tmp/Open-Book-Icon-on-Purple.png

      - name: Commit source image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/Open-Book-Icon-on-Purple.png
          git commit -m "chore: fetch uploaded brand image"
          git push origin HEAD:arena/087d5004-zybble
